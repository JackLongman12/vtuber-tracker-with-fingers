<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avatar Viewer</title>
<style>
  :root { --bg: #111418; --panel: rgba(24,28,34,.88); --text: #e6e8eb; --muted: #8b939c; --accent: #4fb3ff; --ok: #5ad19a; --bad: #ff6b6b; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
  #hud { position: absolute; top: 12px; left: 12px; width: 230px; padding: 12px 14px; background: var(--panel); border-radius: 10px; }
  #hud h1 { font-size: 14px; margin: 0 0 8px; font-weight: 600; }
  .row { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); }
  .row b { color: var(--text); font-weight: 500; }
  .bar { display: grid; grid-template-columns: 70px 1fr; align-items: center; gap: 6px; margin: 3px 0; color: var(--muted); }
  .bar div { height: 6px; background: #2a3038; border-radius: 3px; overflow: hidden; }
  .bar span { display: block; height: 100%; width: 0; background: var(--accent); }
  #status.ok { color: var(--ok); } #status.bad { color: var(--bad); }
  label { display: flex; gap: 6px; align-items: center; margin-top: 8px; color: var(--muted); cursor: pointer; }
  #hint { position: absolute; bottom: 10px; left: 12px; right: 12px; color: var(--muted); }
  .btns { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .btns button, .btns a { font: inherit; color: var(--text); background: #232a33; border: 1px solid #2a3038; border-radius: 7px;
    padding: 5px 9px; cursor: pointer; text-decoration: none; }
  .btns button:hover, .btns a:hover { border-color: var(--accent); }
  #drop { position: fixed; inset: 0; display: none; place-items: center; background: rgba(79,179,255,.15);
    border: 3px dashed var(--accent); font-size: 20px; pointer-events: none; }
  #note { position: absolute; bottom: 36px; left: 50%; transform: translateX(-50%); max-width: 70%; padding: 10px 14px;
    background: var(--panel); border: 1px solid #2a3038; border-radius: 10px; display: none; text-align: center; }
  /* inside the Avatar Studio app (index.html?embed): just the avatar, the app has the buttons and status */
  .embed #hud, .embed #hint { display: none; }
  /* for OBS (index.html?obs): only the avatar, on a transparent background (or ?bg=00ff00 for a colour key) */
  .obs #hud, .obs #hint, .obs #note, .obs #step, .obs #drop { display: none !important; }
  html.obs, .obs body { background: transparent; }
</style>
</head>
<body>
<div id="hud">
  <h1>Avatar viewer</h1>
  <div class="row">Stream <b id="status" class="bad">connecting…</b></div>
  <div class="row">Frames/s <b id="fps">–</b></div>
  <div class="row">Gesture <b id="gesture">–</b></div>
  <div class="row">Distance <b id="dist">–</b></div>
  <div class="row">Avatar <b id="avatar-name">skeleton</b></div>
  <div id="bars" style="margin-top:8px"></div>
  <label><input type="checkbox" id="raw" checked> raw tracked body points</label>
  <label><input type="checkbox" id="skel" checked> skeleton</label>
  <div class="btns">
    <button id="load-avatar" title="VRM, glTF / GLB, FBX or MMD (PMX / PMD); with its textures, or as a .zip">Load avatar…</button>
    <a href="settings.html" target="_blank" data-window="settings">Settings</a>
  </div>
  <input type="file" id="avatar-file" accept=".vrm,.glb,.gltf,.bin,.fbx,.pmx,.pmd,.zip,image/*,.tga,.spa,.sph,.dds" multiple hidden>
</div>
<div id="hint">Drag to orbit · scroll to zoom · drop your avatar anywhere: a .vrm, .glb, .fbx or .pmx file, its folder or a .zip</div>
<div id="drop">Drop your avatar (a file, its folder or a .zip)</div>
<div id="note"></div>
<div id="step" style="display:none;position:absolute;top:12px;left:50%;transform:translateX(-50%);max-width:60%;
  padding:10px 16px;background:rgba(24,28,34,.92);border:1px solid #4fb3ff;border-radius:10px;font-size:15px;text-align:center"></div>

<script>
// three.js 0.160.0 and three-vrm 3.4.0 ship with the app (lib/), so the viewer needs no internet. Opened straight from
// the folder (file://, no web server) the browser won't run local modules: only that case loads them from unpkg.
if (new URLSearchParams(location.search).has('embed')) document.documentElement.classList.add('embed');
if (new URLSearchParams(location.search).has('obs')) document.documentElement.classList.add('obs');
const lib = location.protocol === 'file:'
  ? { three: 'https://unpkg.com/three@0.160.0/', vrm: 'https://unpkg.com/@pixiv/three-vrm@3.4.0/lib/' }
  : { three: './lib/three-0.160.0/', vrm: './lib/three-vrm-3.4.0/' };
document.currentScript.after(Object.assign(document.createElement('script'), { type: 'importmap',
  textContent: JSON.stringify({ imports: { three: lib.three + 'build/three.module.js',
    'three/addons/': lib.three + 'examples/jsm/', '@pixiv/three-vrm': lib.vrm + 'three-vrm.module.js' } }) }));
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

// Unity (left-handed) -> three.js (right-handed): flip Z
const pos = (p) => new THREE.Vector3(p[0], p[1], -p[2]);
const quat = (q) => new THREE.Quaternion(-q[0], -q[1], q[2], q[3]);

// ?obs: for an OBS browser source. Transparent unless ?bg= gives a colour (e.g. 00ff00 for a colour key); ?view=
// full, upper (the default) or face frames the avatar; the avatar picked in the app (Settings > OBS) loads by itself
const params = new URLSearchParams(location.search);
const OBS = params.has('obs');
const bgParam = /^[0-9a-f]{6}$/i.test(params.get('bg') || '') ? params.get('bg') : null;
const VIEW = ['full', 'upper', 'face'].includes(params.get('view')) ? params.get('view') : 'upper';
const scene = new THREE.Scene();
scene.background = OBS ? (bgParam ? new THREE.Color(`#${bgParam}`) : null) : new THREE.Color(0x111418);
if (OBS && bgParam) document.body.style.background = `#${bgParam}`;
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.01, 50);
camera.position.set(0, 1.3, -2.6);  // the avatar faces -Z here, so look at it from the front
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: OBS });
if (OBS) renderer.setClearColor(0x000000, 0);
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.1, 0);
controls.update();
scene.add(new THREE.HemisphereLight(0xffffff, 0x334455, 2.2));
const grid = new THREE.GridHelper(4, 16, 0x3a4450, 0x262c34);
scene.add(grid);
const camMarker = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.12, 4), new THREE.MeshStandardMaterial({ color: 0x8b939c }));
camMarker.position.set(0, 0.06, -1.2); camMarker.rotation.x = -Math.PI / 2; scene.add(camMarker);  // webcam spot, on the floor
if (OBS) grid.visible = camMarker.visible = false;
// OBS framing around the avatar's head (headY: its height in metres): whole body, head and shoulders down to the
// waist, or the face
function frameView(headY = 1.45) {
  const [y, dist] = VIEW === 'full' ? [headY * 0.55, headY * 1.9] : VIEW === 'face' ? [headY + 0.02, 0.6] : [headY - 0.22, 1.35];
  controls.target.set(0, y, 0);
  camera.position.set(0, y + (VIEW === 'full' ? 0.1 : 0.02), -dist);
  controls.update();
}

let rest = null, avatar = null;
const joints = {}, links = [];
const matJoint = new THREE.MeshStandardMaterial({ color: 0xe6e8eb });
const matL = new THREE.MeshStandardMaterial({ color: 0x4fb3ff }), matR = new THREE.MeshStandardMaterial({ color: 0xffa640 });
const matC = new THREE.MeshStandardMaterial({ color: 0xc9ced4 });

// The loaded avatar's own bone layout, sent to the studio so fingertip contacts and no-clipping use its real
// proportions (finger / arm lengths, thumb direction) instead of an average skeleton. Measured right after
// loading, while the bones are still in the rest (T) pose; offsets from each bone's parent in the studio's
// skeleton, converted to the studio's axes (VRM 1.0: x flipped; VRM 0.x faces the other way: z flipped).
let wsConn = null, proportions = null;
function sendProportions() {
  if (model && !proportions) proportions = model.humanoid ? model.proportions : null;  // (avatars.js measured it)
  if (!proportions && (!vrm || !rest)) return;
  if (!proportions) {
    const v0 = vrm.meta?.metaVersion === '0';
    vrm.scene.updateMatrixWorld(true);
    const at = (name) => {
      const n = vrm.humanoid.getNormalizedBoneNode(vrmBone(name));
      return n ? vrm.scene.worldToLocal(n.getWorldPosition(new THREE.Vector3())) : null;
    };
    proportions = {};
    for (const [name, [parent]] of Object.entries(rest)) {
      if (!parent) continue;
      const a = at(parent), b = at(name);
      if (!a || !b) continue;
      const o = b.sub(a);
      proportions[name] = v0 ? [o.x, o.y, -o.z] : [-o.x, o.y, o.z];
    }
  }
  if (wsConn && wsConn.readyState === 1) wsConn.send(JSON.stringify({ type: 'avatar_rest', bones: proportions }));
}

function buildAvatar(bones) {
  rest = bones;
  sendProportions();
  avatar = new THREE.Group(); scene.add(avatar);
  for (const [name, [parent, offset]] of Object.entries(bones)) {
    const j = new THREE.Group();
    j.position.copy(pos(offset));
    (parent ? joints[parent] : avatar).add(j);
    joints[name] = j;
    const small = /Thumb|Index|Middle|Ring|Little|Eye/.test(name);
    j.add(new THREE.Mesh(new THREE.SphereGeometry(small ? 0.008 : 0.022), matJoint));
    if (parent) {  // a capsule from the parent joint to this one, drawn in the parent's space
      const len = pos(offset).length();
      if (len > 0.001 && !name.includes('Eye')) {
        const mat = name.startsWith('Left') ? matL : name.startsWith('Right') ? matR : matC;
        const m = new THREE.Mesh(new THREE.CylinderGeometry(small ? 0.006 : 0.02, small ? 0.006 : 0.02, len, 8), mat);
        m.position.copy(pos(offset).multiplyScalar(0.5));
        m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), pos(offset).normalize());
        joints[parent].add(m);
      }
    }
  }
  // head + nose so you can see where it faces
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.1, 24, 16), matC);
  head.position.set(0, 0.08, 0); joints.Head.add(head);
  const nose = new THREE.Mesh(new THREE.ConeGeometry(0.025, 0.07, 12), matJoint);
  nose.position.set(0, 0.06, -0.1); nose.rotation.x = -Math.PI / 2; joints.Head.add(nose);
  for (const s of ['LeftEye', 'RightEye']) {
    const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.012), new THREE.MeshStandardMaterial({ color: 0x111111 }));
    pupil.position.set(0, 0, -0.03); joints[s].add(pupil);
  }
}

// raw tracked body points (MediaPipe world landmarks, hips-centred) for comparison
const rawGeo = new THREE.BufferGeometry();
rawGeo.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(33 * 3), 3));
const raw = new THREE.Points(rawGeo, new THREE.PointsMaterial({ color: 0x5ad19a, size: 0.03 }));
scene.add(raw);
if (OBS) raw.visible = false;
document.getElementById('raw').onchange = (e) => raw.visible = e.target.checked;

const SHAPES = ['Blink_L', 'Blink_R', 'A', 'I', 'U', 'E', 'O', 'Joy', 'Angry', 'Sorrow', 'Surprised'];
const barsEl = document.getElementById('bars'), barFill = {};
for (const s of SHAPES) {
  const row = document.createElement('div'); row.className = 'bar';
  row.innerHTML = `<span style="background:none;width:auto">${s}</span><div><span></span></div>`;
  barsEl.appendChild(row); barFill[s] = row.querySelector(':scope > div > span');
}

// ---------------------------------------------------------------- your VRM avatar
// Rig data is Unity space (avatar faces +Z, its right hand is +X). A VRM in three.js faces +Z with its right hand
// at -X, so mirror X: position (x,y,z) -> (-x,y,z), quaternion (x,y,z,w) -> (x,-y,-z,w).
// The VRM is turned 180 degrees as a whole so it faces this scene's camera.
let vrm = null, hipsBase = null;
const vrmBone = (name) => {
  let n = name.replace(/^(Left|Right)Thumb(Proximal|Intermediate|Distal)$/, (_, s, seg) =>
    `${s}Thumb${{ Proximal: 'Metacarpal', Intermediate: 'Proximal', Distal: 'Distal' }[seg]}`);  // VRM 1.0 thumb names
  return n[0].toLowerCase() + n.slice(1);
};
const PRESETS = { A: 'aa', I: 'ih', U: 'ou', E: 'ee', O: 'oh', Blink: 'blink', Blink_L: 'blinkLeft',
  Blink_R: 'blinkRight', Joy: 'happy', Angry: 'angry', Sorrow: 'sad', Surprised: 'surprised', Fun: 'relaxed',
  LookUp: 'lookUp', LookDown: 'lookDown' };

function clearAvatar() {  // (before showing the next one)
  if (vrm) { scene.remove(vrm.scene); VRMUtils.deepDispose(vrm.scene); vrm = null; }
  if (model) { model.dispose(); model = null; }
  boneTargets.clear(); hipsTarget = null; proportions = null;
}
async function loadVRM(source, name) {
  const loader = new GLTFLoader();
  loader.register((parser) => new VRMLoaderPlugin(parser));
  const nameEl = document.getElementById('avatar-name'), before = nameEl.textContent;
  nameEl.textContent = 'loading…';
  try {
    const gltf = typeof source === 'string' ? await loader.loadAsync(source) : await loader.parseAsync(source, '');
    if (!gltf.userData.vrm) throw new Error('not a VRM file');
    clearAvatar();
    vrm = gltf.userData.vrm;
    VRMUtils.removeUnnecessaryVertices(gltf.scene);
    VRMUtils.rotateVRM0(vrm);                     // VRM 0.x models face the other way: turn them to match 1.0
    vrm.scene.rotation.y += Math.PI;              // then face this scene's camera (which looks along +Z)
    // (assigning instead of adding here undid the turn above and showed VRM 0.x models from behind)
    if (vrm.lookAt) vrm.lookAt.autoUpdate = false; // eyes come from the tracker
    scene.add(vrm.scene);
    hipsBase = vrm.humanoid.getNormalizedBoneNode('hips').position.clone();
    proportions = null;  // a new avatar: measure it
    sendProportions();
    document.getElementById('avatar-name').textContent = name || vrm.meta?.name || vrm.meta?.title || 'VRM';
    if (OBS) {
      vrm.scene.updateMatrixWorld(true);
      const head = vrm.humanoid.getNormalizedBoneNode('head');
      frameView(head ? head.getWorldPosition(new THREE.Vector3()).y : 1.45);
    }
    document.getElementById('skel').checked = false; avatar && (avatar.visible = false);
  } catch (e) {
    console.error(e);
    nameEl.textContent = vrm || model ? before : 'could not load';  // (the avatar before it stays)
    notify(`Couldn't load ${name || 'that file'} as a VRM avatar.`);
  }
}

// ---------------------------------------------------------------- other avatars (avatars.js)
// glTF / GLB, FBX and MMD models: one file, several (a model with its textures), a folder or a .zip. Live2D models
// run in VTube Studio, so those only get a pointer to it.
let model = null, noteTimer = null;
const embedded = parent !== window;
function notify(text) {  // inside the app: one of its messages; on its own (a browser, OBS): a note over the avatar
  if (embedded) { parent.postMessage({ type: 'avatar-note', text }, '*'); return; }
  const el = document.getElementById('note');
  el.textContent = text; el.style.display = 'block';
  clearTimeout(noteTimer); noteTimer = setTimeout(() => (el.style.display = 'none'), 9000);
}
async function loadFiles(files, entries = []) {
  if (!entries.length && files.length === 1 && /\.vrm$/i.test(files[0].name)) {  // (the usual case: no extra module)
    return loadVRM(await files[0].arrayBuffer(), files[0].name.replace(/\.vrm$/i, ''));
  }
  const nameEl = document.getElementById('avatar-name'), before = nameEl.textContent;
  nameEl.textContent = 'loading…';
  try {
    const formats = await import('./avatars.js');
    const all = await formats.gather(files, entries);
    const what = formats.classify(all);
    if (what.kind === 'vrm') return loadVRM(await all.get(what.main).arrayBuffer(), what.main.split('/').pop().replace(/\.vrm$/i, ''));
    if (what.kind !== 'model') {
      nameEl.textContent = before;
      if (what.kind === 'live2d') {
        if (embedded) parent.postMessage({ type: 'live2d' }, '*');
        else notify('Live2D models run in VTube Studio: load it there and turn on VTube Studio (Live2D) in Avatar Studio\'s settings.');
      } else notify('No avatar in that: drop a .vrm, .glb, .gltf, .fbx, .pmx or .pmd file, its folder or a .zip.');
      return;
    }
    const m = await formats.loadModel(all, what.main, { dracoPath: lib.three + 'examples/jsm/libs/draco/gltf/' });
    clearAvatar();
    model = m;
    scene.add(model.object);
    nameEl.textContent = model.name;
    document.getElementById('skel').checked = false; avatar && (avatar.visible = false);
    sendProportions();
    if (!model.humanoid) notify(`${model.name}: no humanoid skeleton found, so it won't move.`);
    else if (model.missing.length) notify(`${model.name}: missing ${model.missing.slice(0, 3).join(', ')}${model.missing.length > 3 ? ' …' : ''}. Load the whole folder or a .zip for its textures.`);
  } catch (e) {
    console.error(e);
    nameEl.textContent = before === 'loading…' ? 'could not load' : before;
    notify(`Couldn't load that avatar (${e.message || e}).`);
  }
}
const fileInput = document.getElementById('avatar-file');
document.getElementById('load-avatar').onclick = () => fileInput.click();
fileInput.onchange = () => { if (fileInput.files.length) loadFiles([...fileInput.files]); fileInput.value = ''; };
const drop = document.getElementById('drop');
addEventListener('dragover', (e) => { e.preventDefault(); drop.style.display = 'grid'; });
addEventListener('dragleave', (e) => { if (!e.relatedTarget) drop.style.display = 'none'; });
addEventListener('drop', (e) => {
  e.preventDefault(); drop.style.display = 'none';
  // (folders only come as entries, and only while the drop event runs)
  const entries = [...e.dataTransfer.items].map((i) => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  const files = [...e.dataTransfer.files];
  if (files.length || entries.length) loadFiles(files, entries.some((x) => x.isDirectory) ? entries : []);
});
document.getElementById('skel').onchange = (e) => { if (avatar) avatar.visible = e.target.checked; };
// in Avatar Studio's own window (pywebview), the Settings link opens the settings window instead of a browser tab
addEventListener('pywebviewready', () => document.querySelectorAll('[data-window]').forEach((a) => a.onclick = (e) => {
  e.preventDefault(); pywebview.api.open(a.dataset.window);
}));
window.viewerDebug = { get vrm() { return vrm; }, get model() { return model; }, get proportions() { return proportions; },
  THREE, camera, controls, scene, loadFiles, onFrame: (d) => onFrame(d),
  render(dt = 1) { if (vrm) { glide(dt); vrm.update(0); vrm.scene.updateMatrixWorld(true); }
    else if (model) { model.update(1); model.object.updateMatrixWorld(true); }
    renderer.render(scene, camera); } };  // for automated checks from the browser console
const vrmUrl = new URLSearchParams(location.search).get('vrm');
if (vrmUrl) loadVRM(vrmUrl);
else if (OBS) {
  frameView();
  fetch('/avatar.vrm').then((r) => (r.ok ? r.arrayBuffer() : null)).then((b) => b && loadVRM(b)).catch(() => {});
}

// The studio sends ~30 poses a second but the screen redraws 60+ times: setting each pose directly made the avatar
// step (visible as jitter). Poses become targets that every drawn frame glides toward. The glide's time constant
// is half the measured time between poses (16 ms at 30 poses/s): just enough to hide the steps - a fixed 30 ms
// made the viewer trail the studio by ~30 ms.
let glideS = 0.016, lastPoseAt = 0, poseGap = 0.033;
const boneTargets = new Map();  // normalized bone node -> target quaternion
let hipsTarget = null;
function driveVRM(d) {
  const h = vrm.humanoid;
  // the stream is in VRM 1.0 bone space (avatar faces +Z, after flipping X). A VRM 0.x model's normalized bones
  // face -Z instead, so the X and Z axes flip (as in three-vrm's own examples); without this its arms went up
  const v0 = vrm.meta?.metaVersion === '0';
  for (const [name, q] of Object.entries(d.bones)) {
    const node = h.getNormalizedBoneNode(vrmBone(name));
    if (!node) continue;
    const target = boneTargets.get(node) || new THREE.Quaternion();
    target.set(v0 ? -q[0] : q[0], -q[1], v0 ? q[2] : -q[2], q[3]);
    if (!boneTargets.has(node)) { boneTargets.set(node, target); node.quaternion.copy(target); }
  }
  const r = d.root || [0, 0, 0];
  hipsTarget = new THREE.Vector3(hipsBase.x + (v0 ? r[0] : -r[0]), hipsBase.y + r[1], hipsBase.z + (v0 ? -r[2] : r[2]));
  const em = vrm.expressionManager;
  if (!em) return;
  for (const [k, v] of Object.entries(d.vrm || {})) if (PRESETS[k] && em.getExpression(PRESETS[k])) em.setValue(PRESETS[k], v);
  for (const [k, v] of Object.entries(d.arkit || {})) {  // Perfect Sync models: custom expressions named after ARKit
    for (const n of [k, k[0].toUpperCase() + k.slice(1)]) if (em.getExpression(n)) em.setValue(n, v);
  }
}

function glide(dt) {
  const k = 1 - Math.exp(-dt / glideS);
  for (const [node, target] of boneTargets) node.quaternion.slerp(target, k);
  if (hipsTarget) vrm.humanoid.getNormalizedBoneNode('hips').position.lerp(hipsTarget, k);
}

let frames = 0, lastFps = performance.now();
function onFrame(d) {
  frames++;
  const now = performance.now() / 1000;
  if (lastPoseAt && now - lastPoseAt < 0.25) poseGap += (now - lastPoseAt - poseGap) * 0.1;
  lastPoseAt = now;
  glideS = Math.min(Math.max(poseGap * 0.5, 0.006), 0.03);
  if (vrm) driveVRM(d);
  else if (model) model.pose(d);
  if (!avatar) return;
  for (const [name, q] of Object.entries(d.bones)) if (joints[name]) joints[name].quaternion.copy(quat(q));
  for (const name of Object.keys(rest)) if (!(name in d.bones)) joints[name].quaternion.identity();
  const r = d.root || [0, 0, 0];
  joints.Hips.position.copy(pos(rest.Hips[1])).add(pos(r));
  if (d.body_world) {
    const a = rawGeo.attributes.position;
    d.body_world.forEach((p, i) => a.setXYZ(i, p[0] + r[0], p[1] + rest.Hips[1][1], -(p[2] + r[2])));
    a.needsUpdate = true;
  }
  for (const s of SHAPES) barFill[s].style.width = `${Math.round(100 * (d.vrm?.[s] ?? 0))}%`;
  document.getElementById('step').textContent = d.test_step || '';
  document.getElementById('step').style.display = d.test_step ? 'block' : 'none';
  document.getElementById('gesture').textContent = d.gestures?.length ? d.gestures.join(', ') : '–';
  document.getElementById('dist').textContent = d.distance_cm ? `${Math.round(d.distance_cm)} cm` : '–';
}

// ?ws= picks another port (--ws-port); only this PC's addresses, so a link can't point the page at someone's server
const LOCAL_WS = /^ws:\/\/(127\.0\.0\.1|localhost|\[::1\])(:\d{1,5})?\/?$/i;
const wsParam = new URLSearchParams(location.search).get('ws');
const url = wsParam && LOCAL_WS.test(wsParam) ? wsParam : 'ws://127.0.0.1:8765';
const statusEl = document.getElementById('status');
let retry = 500, retryTimer = null;  // waits longer between tries (up to 5 s) while the studio is off
function connect() {
  const ws = new WebSocket(url);
  wsConn = ws;
  ws.onopen = () => { statusEl.textContent = 'connected'; statusEl.className = 'ok'; retry = 500; sendProportions(); };
  ws.onclose = () => { statusEl.textContent = 'reconnecting…'; statusEl.className = 'bad'; retryTimer = setTimeout(connect, retry); retry = Math.min(retry * 1.6, 5000); };
  ws.onmessage = (ev) => {
    const d = JSON.parse(ev.data);
    if (d.type === 'rest' && !avatar) buildAvatar(d.bones);
    else if (d.type === 'frame' && d.bones) onFrame(d);
  };
}
connect();
// the Avatar Studio app says when tracking starts: connect now instead of after the waiting time
addEventListener('message', (e) => {
  if (e.data === 'connect' && (!wsConn || wsConn.readyState > 1)) { clearTimeout(retryTimer); retry = 500; connect(); }
});
if (parent !== window) {  // (inside the app: its keys - C, V, P, 1-9 ... - work while the avatar has the focus too)
  addEventListener('keydown', (e) => parent.postMessage({ type: 'key', key: e.key, mods: e.ctrlKey || e.altKey || e.metaKey }, '*'));
}

setInterval(() => {
  const now = performance.now();
  document.getElementById('fps').textContent = Math.round(frames * 1000 / (now - lastFps));
  frames = 0; lastFps = now;
}, 1000);
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
});
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1);
  if (vrm) {
    glide(dt);
    vrm.update(dt);  // applies bones + expressions, runs hair/cloth spring physics
  } else if (model) model.update(1 - Math.exp(-dt / glideS));
  renderer.render(scene, camera);
});
</script>
</body>
</html>
